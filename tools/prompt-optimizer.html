<style>

textarea:focus{border-color:#00d2ff}

.check-item{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 14px;cursor:pointer;transition:border-color .2s}

.nav-links a{color:#7ec8e3;text-decoration:none;font-size:.9rem;padding:6px 14px;border-radius:8px;background:rgba(255,255,255,0.04);transition:background .2s}

<body>
<div class="wrap">
<a href="index.html" class="back-link">← 返回工具列表</a>
<header><h1>🧠 提示词优化器</h1><p>输入原始提示词，添加优化要素，生成结构化优质提示词</p></header>
<div class="card">
<label for="rawPrompt">原始提示词</label>
<textarea id="rawPrompt" placeholder="例如：帮我写一篇文章关于人工智能的未来发展"></textarea>
<label>优化选项（可选）</label>
<div class="check-group">
<label class="check-item"><input type="checkbox" id="optRole" checked><span>🎭 角色设定</span></label>
<label class="check-item"><input type="checkbox" id="optContext"><span>📋 背景补充</span></label>
<label class="check-item"><input type="checkbox" id="optFormat" checked><span>📐 输出格式</span></label>
<label class="check-item"><input type="checkbox" id="optConstraint"><span>🚫 约束条件</span></label>
<label class="check-item"><input type="checkbox" id="optExample"><span>💡 示例参考</span></label>
<label class="check-item"><input type="checkbox" id="optStep"><span>🔢 步骤分解</span></label>
</div>
<button onclick="optimize()">🚀 优化提示词</button>
<div class="btn-row" id="btnRow" style="display:none">
<button onclick="copyResult()">📋 复制结果</button>
</div>
<div id="output" class="output-box"></div>
</div>
<div class="tools-nav">
<strong>SEO 工具：</strong>

</div>
<div class="nav-links">

<a href="/nocode-tools/">🔧 NoCode工具导航</a>
<a href="/cn-seo-site/">🔍 中文SEO工具箱</a>
</div>
</div>
<footer>
<p>本工具由 AI 站群联合出品 · 所有工具均在浏览器端运行，不收集任何数据</p>
<p>生成时间：<span id="genTime"></span></p>
</footer>
<div id="toast" class="toast">已复制到剪贴板 ✓</div>
<script>
let resultText='';
function optimize(){
 const raw=document.getElementById('rawPrompt').value.trim();
 if(!raw){alert('请先输入原始提示词');return}
 let optimized=`# 角色设定\n你是一位经验丰富的专业顾问，擅长分析和解决问题。\n\n`;
 optimized+=`# 任务\n${raw}\n\n`;
 if(document.getElementById('optContext').checked){
  optimized+=`# 背景信息\n请基于当前行业最佳实践和最新发展趋势，提供专业且实用的建议。\n\n`;
 }
 if(document.getElementById('optFormat').checked){
  optimized+=`# 输出格式\n请以结构化的方式呈现回答，包含以下部分：\n- **概述**：简要总结核心观点\n- **详细内容**：分点阐述，每点配有具体说明\n- **总结**：归纳关键要点\n- **下一步建议**：提供可执行的操作建议\n\n`;
 }
 if(document.getElementById('optConstraint').checked){
  optimized+=`# 约束条件\n- 回答需专业、准确、有据可依\n- 避免空泛的表述，尽量提供具体案例或数据\n- 如有多种方案，请分别列出优缺点\n- 语言简洁明了，条理清晰\n\n`;
 }
 if(document.getElementById('optExample').checked){
  optimized+=`# 示例参考\n请参照以下风格进行回答：\n- 先给出结论，再展开论述\n- 使用编号列表组织要点\n- 关键信息加粗标注\n\n`;
 }
 if(document.getElementById('optStep').checked){
  optimized+=`# 思考步骤\n请按以下步骤进行分析：\n1. **理解问题**：明确核心需求和目标\n2. **拆解要素**：将问题分解为若干子问题\n3. **逐一分析**：对每个子问题进行深入探讨\n4. **综合结论**：整合各部分分析，得出整体结论\n\n`;
 }
 optimized+=`---\n*Generated by AI 提示词优化器*`;
 resultText=optimized;
 const box=document.getElementById('output');
 box.style.display='block';
 box.textContent=resultText;
 document.getElementById('btnRow').style.display='flex';
}
function copyResult(){
 navigator.clipboard.writeText(resultText).then(showToast);
}
function showToast(){
 const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);
}
document.getElementById('genTime').textContent=new Date().toLocaleString('zh-CN');
</script>
</body>
